# Replace the placeholder paths with your local project and Python paths.
[mcp_servers.personal_rs]
command = 'C:/path/to/rs-declaration-connector/.venv/Scripts/python.exe'
args = ['C:/path/to/rs-declaration-connector/server.py']
startup_timeout_sec = 30
tool_timeout_sec = 90

[mcp_servers.personal_rs.env]
RS_LEDGER_PATH = 'C:/path/to/rs-declaration-connector/private-data/incomes.sqlite3'
PYTHONUTF8 = '1'
